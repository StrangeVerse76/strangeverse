# Elimina il branch Neon di un'anteprima quando la sua PR si chiude (unita o no).
# L'integrazione Neon di Vercel crea un branch `preview/<branch git>` per ogni anteprima, e il
# piano gratuito ne permette solo 10: senza pulizia le anteprime smettono di partire.
name: Pulizia branch Neon

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Elimina il branch dell'anteprima
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        # Se il branch non c'è (la PR non toccava Soundverse, o è già stato tolto), va bene lo stesso.
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
