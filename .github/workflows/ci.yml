name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Questo nome è il controllo obbligatorio nel ruleset di main: non rinominarlo.
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Turborepo --affected confronta con il branch di base: serve la cronologia.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formattazione
        run: pnpm format:check

      # I browser di Playwright si scaricano una volta e restano in cache finché non cambia il lockfile.
      - name: Cache dei browser di Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Installazione dei browser di Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @strangeverse/portale exec playwright install --with-deps chromium

      - name: Lint, typecheck, test, build ed e2e (solo pacchetti toccati)
        if: github.event_name == 'pull_request'
        # Nel checkout della PR esiste solo origin/<base>, non il branch locale.
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: pnpm turbo run lint typecheck test build test:e2e --affected

      - name: Lint, typecheck, test, build ed e2e (tutto)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run lint typecheck test build test:e2e

      - name: Report di Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
